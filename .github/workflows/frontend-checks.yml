name: Frontend checks

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - role6-deployment-ops-roy

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Guard held-out evaluation custody
        run: python scripts/check_held_out_custody.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install application
        id: install
        run: python -m pip install ".[dev]"

      - name: Compile Python sources
        run: python -m compileall -q src

      - name: Run frontend fixture tests
        run: >-
          python -m pytest
          --ignore=tests/test_red_team_runtime.py
          --ignore=tests/test_e2_runtime.py
          --ignore=tests/test_e1_workflow_comparison.py

      - name: Run Role 5 development evaluation gate
        run: python scripts/run_role5_dev_evals.py

      # E3's hosted-CI scope is deliberately the reproducible, offline
      # playbook/freeze inventory. The n=13 all-live-clause evaluation consumes
      # a protected local case file and MUST NOT be copied into CI/artifacts.
      - name: Run E3 offline playbook and check-split inventory
        run: >-
          python scripts/evaluate_reflexion_playbook_dev.py
          --output eval/reports/reflexion_e3_ci_latest.json

      - name: Run E4 frozen team-override offline ablation
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python scripts/evaluate_e4_signature_ablation.py --team-override

      - name: Enforce E4 offline acceptance contract
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("eval/reports/e4_team_override_signature_ablation_2026-11-13.json")
          if not path.is_file():
              raise SystemExit(f"Missing E4 report: {path}")
          report = json.loads(path.read_text(encoding="utf-8"))
          if report.get("experiment_id") != "E4":
              raise SystemExit("E4 report has the wrong experiment_id")
          if report.get("claim_level") != "team_override_dev_personas":
              raise SystemExit("E4 report is not labelled team_override_dev_personas")
          arms = report.get("arms") or {}
          required = ("shadow_stub", "question_order", "journey_question_order")
          for name in required:
              arm = arms.get(name) or {}
              if arm.get("status") != "ran":
                  raise SystemExit(f"E4 arm did not run: {name}")
              if arm.get("case_count") != 46:
                  raise SystemExit(
                      f"E4 {name} expected 46 frozen development cases; "
                      f"got {arm.get('case_count')!r}"
                  )
          journey = arms["journey_question_order"]
          if journey.get("citizen_mode") != "offline_card":
              raise SystemExit("E4 CI must use the offline card citizen")
          if arms.get("llm_eligibility", {}).get("status") == "ran":
              raise SystemExit("Live LLM arm is not permitted in automatic CI")
          print("E4 acceptance contract passed: 3 offline arms × 46 cases.")
          PY

      # E1's hosted-CI scope is the offline integrated workflow comparison: the
      # fixed workflow (C0), single agent (C1) and specialist team (C2) on the
      # synthetic development cases with the pinned scripted model. No live
      # model is called; the live and held-out E1 runs stay manual.
      - name: Run E1 offline workflow comparison
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: >-
          python -m pytest -q --disable-warnings
          -o junit_family=legacy
          --junitxml=eval/reports/e1_offline_ci_junit.xml
          tests/test_e1_workflow_comparison.py

      - name: Enforce E1 offline acceptance contract
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from collections import Counter
          from pathlib import Path

          path = Path("eval/reports/e1_offline_ci_junit.xml")
          if not path.is_file():
              raise SystemExit(f"Missing E1 JUnit report: {path}")
          cases = list(ET.parse(path).getroot().iter("testcase"))
          if len(cases) != 9:
              raise SystemExit(f"E1 expected 9 workflow cases (3 development cases x 3 arms); got {len(cases)}")
          for case in cases:
              for tag in ("failure", "error", "skipped"):
                  if case.find(tag) is not None:
                      raise SystemExit(f"E1 case {case.get('name')} has a {tag}")
          observations = []
          for case in cases:
              props = {p.get("name"): p.get("value") for p in case.iter("property")}
              if "e1_observation" not in props:
                  raise SystemExit(f"E1 case {case.get('name')} recorded no observation")
              observations.append(json.loads(props["e1_observation"]))
          per_arm = Counter(o["arm_id"] for o in observations)
          if per_arm != Counter({"C0": 3, "C1": 3, "C2": 3}):
              raise SystemExit(f"E1 arms are not C0, C1 and C2 with 3 cases each: {dict(per_arm)}")
          case_ids = {o["case_id"] for o in observations}
          if len(case_ids) != 3 or any(
              {o["arm_id"] for o in observations if o["case_id"] == cid} != {"C0", "C1", "C2"}
              for cid in case_ids
          ):
              raise SystemExit("E1 every development case must run on all three arms")
          for o in observations:
              label = f"{o['arm_id']} {o['case_id']}"
              if o["task_success"] is not True or o["error"] or o["timeout"]:
                  raise SystemExit(f"E1 {label} did not succeed")
              if o["policy_violations"]:
                  raise SystemExit(f"E1 {label} recorded policy violations")
              expected = "deterministic_workflow" if o["arm_id"] == "C0" else "scripted_model"
              if o["outcome_source"] != expected:
                  raise SystemExit(f"E1 {label} used {o['outcome_source']!r}, expected {expected!r}; live models are not permitted in automatic CI")
              if o["arm_id"] == "C0" and o["model_calls"] != 0:
                  raise SystemExit("E1 C0 must make no model calls")
          print("E1 offline acceptance contract: PASS (9 cases, 3 arms, scripted model only)")
          PY

      - name: Run approved application-path red-team gate
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python scripts/evaluate_red_team_runtime.py

      - name: Run application-boundary E2 gate
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python scripts/evaluate_e2_runtime.py

      - name: Upload synthetic runtime and E1/E3/E4 evaluation reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: runtime-development-evaluations
          path: |
            eval/reports/red_team_runtime_latest.json
            eval/reports/e2_runtime_dev_latest.json
            eval/reports/reflexion_e3_ci_latest.json
            eval/reports/e1_offline_ci_junit.xml
            eval/reports/e4_team_override_signature_ablation_2026-11-13.json
            eval/reports/e4_team_override_signature_ablation_2026-11-13_journey_qo_cases.json
          if-no-files-found: warn
          retention-days: 7

      # Import from outside the checkout so source files cannot mask package
      # data that is missing from the built installation.
      - name: Verify installed fixture package
        working-directory: /tmp
        run: |
          python -c "from src.ui.data_provider import FixtureDataProvider; fixtures = FixtureDataProvider().fixtures; print(fixtures.policy.scheme_id)"
