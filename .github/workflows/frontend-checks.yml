name: Frontend checks

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - role6-deployment-ops-roy

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install application
        run: python -m pip install ".[dev]"

      - name: Compile Python sources
        run: python -m compileall -q src

      - name: Run frontend fixture tests
        run: python -m pytest

      # Import from outside the checkout so source files cannot mask package
      # data that is missing from the built installation.
      - name: Verify installed fixture package
        working-directory: /tmp
        run: |
          python -c "from src.ui.data_provider import FixtureDataProvider; fixtures = FixtureDataProvider().fixtures; print(fixtures.policy.scheme_id)"
