# This workflow lets any trusted repository member deploy a pushed branch to
# the one shared development Container App. It intentionally validates the
# selected commit before Azure receives any change.
name: Shared development deploy
run-name: "Shared dev: ${{ inputs.ref }}"

on:
  # Members start this workflow manually and provide the branch they want to
  # test. The workflow definition itself must be loaded from main.
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to validate and deploy
        required: true
        type: string

# Validation needs only repository read access. The deploy job separately adds
# id-token permission for passwordless Azure OIDC authentication.
permissions:
  contents: read

# Every branch targets the same app and URL. Queue deployments instead of
# allowing two members to update that shared app at the same time.
concurrency:
  group: scheme-saathi-shared-dev
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      # Pass the immutable commit SHA to deploy. If the branch advances while
      # this workflow runs, deployment still uses the commit that was tested.
      target_sha: ${{ steps.target.outputs.sha }}

    steps:
      - name: Check out selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Record selected commit
        id: target
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install application
        run: python -m pip install ".[dev]"

      - name: Compile Python sources
        run: python -m compileall -q src

      - name: Run tests
        run: python -m pytest

      # Run outside the checkout so repository files cannot hide missing JSON
      # package data from the installed Python package.
      - name: Verify installed fixture package
        working-directory: /tmp
        run: |
          python -c "from src.ui.data_provider import FixtureDataProvider; fixtures = FixtureDataProvider().fixtures; print(fixtures.policy.scheme_id)"

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The environment supplies Azure identifiers and is also part of the
    # federated credential subject checked by Microsoft Entra ID.
    environment: shared-dev
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_CONTAINER_APP: ${{ vars.AZURE_CONTAINER_APP }}
      AZURE_CONTAINER_ENVIRONMENT: ${{ vars.AZURE_CONTAINER_ENVIRONMENT }}
      AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      TARGET_REF: ${{ inputs.ref }}
      TARGET_SHA: ${{ needs.validate.outputs.target_sha }}

    steps:
      # Check out the tested SHA rather than the moving branch name.
      - name: Check out validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.target_sha }}

      # Fail clearly before Azure login if an environment variable is missing.
      - name: Verify deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          required_variables=(
            AZURE_CLIENT_ID
            AZURE_TENANT_ID
            AZURE_SUBSCRIPTION_ID
            AZURE_RESOURCE_GROUP
            AZURE_CONTAINER_APP
            AZURE_CONTAINER_ENVIRONMENT
            AZURE_ACR_NAME
            AZURE_LOCATION
            TARGET_REF
            TARGET_SHA
          )
          for variable in "${required_variables[@]}"; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::$variable is not configured"
              exit 1
            fi
          done
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      # azure/login exchanges GitHub's short-lived OIDC token for Azure access.
      # There is no client secret and no team member's Azure login is used.
      - name: Log in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Confirm that the configured names point to the existing Scheme Saathi
      # resources. This workflow must never create resources in another group.
      - name: Verify existing Azure targets
        shell: bash
        run: |
          set -euo pipefail
          az containerapp env show \
            --name "$AZURE_CONTAINER_ENVIRONMENT" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --output none
          actual_location="$(
            az containerapp show \
              --name "$AZURE_CONTAINER_APP" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --query location \
              --output tsv |
            tr -d ' ' |
            tr '[:upper:]' '[:lower:]'
          )"
          test "$actual_location" = "$AZURE_LOCATION"

      # ACR builds the tested checkout and tags it with the commit SHA. Logs are
      # disabled because the run is polled explicitly and this avoids Windows
      # Azure CLI encoding problems seen during earlier local deployments.
      - name: Build selected commit
        id: build
        shell: bash
        run: |
          set -euo pipefail
          image_tag="git-${TARGET_SHA:0:12}"
          image="${AZURE_ACR_NAME}.azurecr.io/${AZURE_CONTAINER_APP}:${image_tag}"
          build_run_id="$(
            az acr build \
              --registry "$AZURE_ACR_NAME" \
              --image "${AZURE_CONTAINER_APP}:${image_tag}" \
              --no-logs \
              --query runId \
              --output tsv \
              .
          )"
          test -n "$build_run_id"

          for attempt in {1..40}; do
            status="$(
              az acr task show-run \
                --registry "$AZURE_ACR_NAME" \
                --run-id "$build_run_id" \
                --query status \
                --output tsv
            )"
            case "$status" in
              Succeeded)
                break
                ;;
              Queued|Started|Running)
                ;;
              *)
                echo "::error::ACR build $build_run_id finished with status $status"
                exit 1
                ;;
            esac
            if [[ "$attempt" -eq 40 ]]; then
              echo "::error::ACR build $build_run_id did not finish in time"
              exit 1
            fi
            sleep 15
          done

          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"
          echo "build_run_id=$build_run_id" >> "$GITHUB_OUTPUT"

      # Updating the image creates an Azure Container Apps revision. Single
      # revision mode keeps the previous healthy revision serving traffic until
      # the new revision is ready.
      - name: Deploy built image
        shell: bash
        run: |
          set -euo pipefail
          az containerapp update \
            --name "$AZURE_CONTAINER_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "${{ steps.build.outputs.image }}" \
            --min-replicas 0 \
            --max-replicas 1 \
            --set-env-vars \
              "APP_VERSION=${{ steps.build.outputs.image_tag }}" \
              "DEPLOYED_REF=$TARGET_REF" \
            --output none

      # Wait for Azure to identify the latest revision as ready, then call the
      # Streamlit health endpoint through the same public URL used by testers.
      - name: Verify deployed revision
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..20}; do
            app_json="$(
              az containerapp show \
                --name "$AZURE_CONTAINER_APP" \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --output json
            )"
            latest="$(jq -r '.properties.latestRevisionName' <<< "$app_json")"
            ready="$(jq -r '.properties.latestReadyRevisionName' <<< "$app_json")"
            running="$(jq -r '.properties.runningStatus' <<< "$app_json")"
            fqdn="$(jq -r '.properties.configuration.ingress.fqdn' <<< "$app_json")"
            if [[ "$latest" = "$ready" && "$running" = "Running" ]]; then
              break
            fi
            if [[ "$attempt" -eq 20 ]]; then
              echo "::error::The new revision did not become ready in time"
              exit 1
            fi
            sleep 15
          done

          url="https://${fqdn}"
          healthy=false
          for attempt in {1..12}; do
            if curl \
              --fail \
              --silent \
              --show-error \
              --max-time 30 \
              "${url}/_stcore/health" > /dev/null; then
              healthy=true
              break
            fi
            sleep 10
          done
          if [[ "$healthy" != true ]]; then
            echo "::error::The public health check failed"
            exit 1
          fi

          echo "revision=$ready" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # Put the useful result in the GitHub Actions summary instead of making
      # team members search through build logs.
      - name: Publish deployment summary
        shell: bash
        run: |
          {
            echo "## Shared development deployment"
            echo
            echo "- Ref: \`$TARGET_REF\`"
            echo "- Commit: \`$TARGET_SHA\`"
            echo "- Revision: \`${{ steps.verify.outputs.revision }}\`"
            echo "- URL: ${{ steps.verify.outputs.url }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Log out of Azure
        if: always()
        run: az logout
