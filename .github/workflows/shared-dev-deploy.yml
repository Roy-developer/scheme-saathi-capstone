# This workflow deploys one validated image to the existing shared frontend
# and backend Container Apps.
name: Shared development deploy
run-name: "Shared dev: ${{ inputs.ref }}"

on:
  # Members start this workflow manually and provide the branch they want to
  # test. The workflow definition itself must be loaded from main.
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to validate and deploy
        required: true
        type: string

# Validation needs only repository read access. The deploy job separately adds
# id-token permission for passwordless Azure OIDC authentication.
permissions:
  contents: read

# Every branch targets the same two apps. Queue deployments instead of
# allowing two members to update them at the same time.
concurrency:
  group: scheme-saathi-shared-dev
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      # Pass the immutable commit SHA to deploy. If the branch advances while
      # this workflow runs, deployment still uses the commit that was tested.
      target_sha: ${{ steps.target.outputs.sha }}

    steps:
      - name: Check out selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Record selected commit
        id: target
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install application
        run: python -m pip install ".[dev]"

      - name: Compile Python sources
        run: python -m compileall -q src

      - name: Install xvfb for headless UI tests
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run tests with xvfb
        run: xvfb-run -a python -m pytest -v

      # Run outside the checkout so repository files cannot hide missing JSON
      # package data from the installed Python package.
      - name: Verify installed fixture package
        working-directory: /tmp
        run: |
          python -c "from src.ui.data_provider import FixtureDataProvider; fixtures = FixtureDataProvider().fixtures; print(fixtures.policy.scheme_id)"

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The environment supplies Azure identifiers and is also part of the
    # federated credential subject checked by Microsoft Entra ID.
    environment: shared-dev
    permissions:
      contents: read
      # Required only so azure/login can exchange GitHub's short-lived identity
      # token; it does not grant repository write access.
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_CONTAINER_APP: ${{ vars.AZURE_CONTAINER_APP }}
      AZURE_API_APP: ${{ vars.AZURE_API_APP }}
      AZURE_CONTAINER_ENVIRONMENT: ${{ vars.AZURE_CONTAINER_ENVIRONMENT }}
      AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      TARGET_REF: ${{ inputs.ref }}
      TARGET_SHA: ${{ needs.validate.outputs.target_sha }}

    steps:
      # Check out the tested SHA rather than the moving branch name.
      - name: Check out validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.target_sha }}

      # Fail clearly before Azure login if an environment variable is missing.
      - name: Verify deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          required_variables=(
            AZURE_CLIENT_ID
            AZURE_TENANT_ID
            AZURE_SUBSCRIPTION_ID
            AZURE_RESOURCE_GROUP
            AZURE_CONTAINER_APP
            AZURE_API_APP
            AZURE_CONTAINER_ENVIRONMENT
            AZURE_ACR_NAME
            AZURE_LOCATION
            TARGET_REF
            TARGET_SHA
          )
          for variable in "${required_variables[@]}"; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::$variable is not configured"
              exit 1
            fi
          done
          if [[ "$AZURE_CONTAINER_APP" = "$AZURE_API_APP" ]]; then
            echo "::error::Frontend and backend must be separate existing apps"
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      # azure/login exchanges GitHub's short-lived OIDC token for Azure access.
      # There is no client secret and no team member's Azure login is used.
      - name: Log in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Confirm that the configured names point to the existing Scheme Saathi
      # resources. This workflow must never create resources in another group.
      - name: Verify existing Azure targets
        id: targets
        shell: bash
        run: |
          set -euo pipefail
          environment_id="$(
            az containerapp env show \
              --name "$AZURE_CONTAINER_ENVIRONMENT" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --query id \
              --output tsv
          )"
          for app_name in "$AZURE_API_APP" "$AZURE_CONTAINER_APP"; do
            app_json="$(
              az containerapp show \
                --name "$app_name" \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --output json
            )"
            actual_location="$(jq -r '.location' <<< "$app_json" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
            actual_environment="$(jq -r '.properties.managedEnvironmentId' <<< "$app_json")"
            if [[ "$actual_location" != "$AZURE_LOCATION" ]]; then
              echo "::error::$app_name is not in the configured Azure location"
              exit 1
            fi
            if [[ "$actual_environment" != "$environment_id" ]]; then
              echo "::error::$app_name is not in the configured Container Apps environment"
              exit 1
            fi
          done
          api_fqdn="$(
            az containerapp show \
              --name "$AZURE_API_APP" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --query properties.configuration.ingress.fqdn \
              --output tsv
          )"
          test -n "$api_fqdn"
          echo "api_fqdn=$api_fqdn" >> "$GITHUB_OUTPUT"

      # ACR builds the tested checkout and tags it with the commit SHA. Logs are
      # disabled because the run is polled explicitly and this avoids Windows
      # Azure CLI encoding problems seen during earlier local deployments.
      - name: Build selected commit
        id: build
        shell: bash
        run: |
          set -euo pipefail
          image_tag="git-${TARGET_SHA:0:12}"
          image="${AZURE_ACR_NAME}.azurecr.io/scheme-saathi:${image_tag}"
          build_run_id="$(
            az acr build \
              --registry "$AZURE_ACR_NAME" \
              --image "scheme-saathi:${image_tag}" \
              --no-logs \
              --query runId \
              --output tsv \
              .
          )"
          test -n "$build_run_id"

          for attempt in {1..40}; do
            status="$(
              az acr task show-run \
                --registry "$AZURE_ACR_NAME" \
                --run-id "$build_run_id" \
                --query status \
                --output tsv
            )"
            case "$status" in
              Succeeded)
                break
                ;;
              Queued|Started|Running)
                ;;
              *)
                echo "::error::ACR build $build_run_id finished with status $status"
                exit 1
                ;;
            esac
            if [[ "$attempt" -eq 40 ]]; then
              echo "::error::ACR build $build_run_id did not finish in time"
              exit 1
            fi
            sleep 15
          done

          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"
          echo "build_run_id=$build_run_id" >> "$GITHUB_OUTPUT"

      # Use the same image in both existing apps, selecting one service per
      # app with a startup command override.
      - name: Deploy backend image
        shell: bash
        run: |
          set -euo pipefail
          az containerapp update \
            --name "$AZURE_API_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "${{ steps.build.outputs.image }}" \
            --command python src/run_services.py \
            --args api \
            --min-replicas 0 \
            --max-replicas 1 \
            --set-env-vars \
              "APP_VERSION=${{ steps.build.outputs.image_tag }}" \
              "DEPLOYED_REF=$TARGET_REF" \
            --output none

      - name: Deploy frontend image
        shell: bash
        env:
          API_FQDN: ${{ steps.targets.outputs.api_fqdn }}
        run: |
          set -euo pipefail
          az containerapp update \
            --name "$AZURE_CONTAINER_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "${{ steps.build.outputs.image }}" \
            --command python src/run_services.py \
            --args ui \
            --min-replicas 0 \
            --max-replicas 1 \
            --set-env-vars \
              "APP_VERSION=${{ steps.build.outputs.image_tag }}" \
              "DEPLOYED_REF=$TARGET_REF" \
              "SCHEME_SAATHI_API_URL=https://${API_FQDN}" \
            --output none

      - name: Verify deployed services
        id: verify
        shell: bash
        env:
          EXPECTED_API_URL: https://${{ steps.targets.outputs.api_fqdn }}
          EXPECTED_IMAGE: ${{ steps.build.outputs.image }}
        run: |
          set -euo pipefail
          verify_container() {
            local app_name="$1"
            local expected_command="$2"
            local expected_args="$3"
            local app_json image command args
            app_json="$(
              az containerapp show \
                --name "$app_name" \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --output json
            )"
            image="$(jq -r '.properties.template.containers[0].image' <<< "$app_json")"
            command="$(jq -r '(.properties.template.containers[0].command // []) | join(" ")' <<< "$app_json")"
            args="$(jq -r '(.properties.template.containers[0].args // []) | join(" ")' <<< "$app_json")"
            if [[ "$image" != "$EXPECTED_IMAGE" ]]; then
              echo "::error::$app_name is not running the shared image"
              return 1
            fi
            if [[ "$command" != "$expected_command" || "$args" != "$expected_args" ]]; then
              echo "::error::$app_name has an unexpected startup command override"
              return 1
            fi
          }

          verify_container "$AZURE_API_APP" "python src/run_services.py" "api"
          verify_container "$AZURE_CONTAINER_APP" "python src/run_services.py" "ui"

          wait_for_app() {
            local app_name="$1"
            local expected_port="$2"
            local latest ready running fqdn app_json target_port
            for attempt in {1..20}; do
              app_json="$(
                az containerapp show \
                  --name "$app_name" \
                  --resource-group "$AZURE_RESOURCE_GROUP" \
                  --output json
              )"
              latest="$(jq -r '.properties.latestRevisionName' <<< "$app_json")"
              ready="$(jq -r '.properties.latestReadyRevisionName' <<< "$app_json")"
              running="$(jq -r '.properties.runningStatus' <<< "$app_json")"
              fqdn="$(jq -r '.properties.configuration.ingress.fqdn' <<< "$app_json")"
              target_port="$(jq -r '.properties.configuration.ingress.targetPort' <<< "$app_json")"
              if [[ "$latest" = "$ready" && "$running" = "Running" ]]; then
                if [[ "$target_port" != "$expected_port" ]]; then
                  echo "::error::$app_name ingress does not target port $expected_port"
                  return 1
                fi
                printf '%s\t%s\n' "$ready" "$fqdn"
                return 0
              fi
              if [[ "$attempt" -eq 20 ]]; then
                echo "::error::$app_name did not become ready in time"
                return 1
              fi
              sleep 15
            done
          }

          api_result="$(wait_for_app "$AZURE_API_APP" 8000)"
          api_revision="${api_result%%$'\t'*}"
          api_fqdn="${api_result#*$'\t'}"
          ui_result="$(wait_for_app "$AZURE_CONTAINER_APP" 8501)"
          ui_revision="${ui_result%%$'\t'*}"
          ui_fqdn="${ui_result#*$'\t'}"

          for check in \
            "https://${api_fqdn}/health" \
            "https://${ui_fqdn}/_stcore/health"; do
            healthy=false
            for attempt in {1..12}; do
              if curl --fail --silent --show-error --max-time 30 "$check" > /dev/null; then
                healthy=true
                break
              fi
              sleep 10
            done
            if [[ "$healthy" != true ]]; then
              echo "::error::Health check failed for ${check%%/*}"
              exit 1
            fi
          done

          configured_api_url="$(
            az containerapp show \
              --name "$AZURE_CONTAINER_APP" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --query "properties.template.containers[0].env[?name=='SCHEME_SAATHI_API_URL'].value | [0]" \
              --output tsv
          )"
          if [[ "$configured_api_url" != "$EXPECTED_API_URL" ]]; then
            echo "::error::Frontend API URL does not match the backend app"
            exit 1
          fi

          journey_response="$(
            curl --fail --silent --show-error --max-time 60 \
              "https://${api_fqdn}/api/v1/journey" \
              -H 'Content-Type: application/json' \
              -d '{"action":"evaluate","scheme_id":"IGNWPS-MH","profile":{"date_of_birth":"1986-10-30","application_date":"2026-10-30","is_widow":true,"bpl_card_shown":true}}'
          )"
          if [[ "$(jq -r '.status' <<< "$journey_response")" != "eligible" ]]; then
            echo "::error::Backend journey smoke test returned an unexpected result"
            exit 1
          fi

          echo "api_revision=$api_revision" >> "$GITHUB_OUTPUT"
          echo "api_url=https://${api_fqdn}" >> "$GITHUB_OUTPUT"
          echo "ui_revision=$ui_revision" >> "$GITHUB_OUTPUT"
          echo "ui_url=https://${ui_fqdn}" >> "$GITHUB_OUTPUT"

      # Put the useful result in the GitHub Actions summary instead of making
      # team members search through build logs.
      - name: Publish deployment summary
        shell: bash
        run: |
          {
            echo "## Shared development deployment"
            echo
            echo "- Ref: \`$TARGET_REF\`"
            echo "- Commit: \`$TARGET_SHA\`"
            echo "- Backend revision: \`${{ steps.verify.outputs.api_revision }}\`"
            echo "- Backend URL: ${{ steps.verify.outputs.api_url }}"
            echo "- Frontend revision: \`${{ steps.verify.outputs.ui_revision }}\`"
            echo "- Frontend URL: ${{ steps.verify.outputs.ui_url }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Log out of Azure
        if: always()
        run: az logout
