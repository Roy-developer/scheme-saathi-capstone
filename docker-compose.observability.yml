# Role 6 handoff: optional Prometheus + Grafana beside the API.
# Usage (after the API is reachable as hostname "api" or edit prometheus.yml):
#   docker compose -f docker-compose.observability.yml up -d
#
# This does not replace full project Compose (app + MCP + vectors). It only
# wires the Role 5 /metrics endpoint into a scrapable dashboard stack.

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
