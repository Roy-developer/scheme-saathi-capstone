




[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "scheme-saathi-capstone"
version = "0.1.0"
description = "Scheme Saathi capstone application"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.40,<2",
  # Install the MCP SDK at runtime because the API and MCP server both use it.
  "mcp>=2,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
