




[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "scheme-saathi-capstone"
version = "0.1.0"
description = "Scheme Saathi capstone application"
requires-python = ">=3.11"
dependencies = [
  "aiosqlite>=0.20,<1",
  "fastapi>=0.115,<1",
  "streamlit>=1.40,<2",
  "uvicorn[standard]>=0.30,<1",
  # Install the MCP SDK at runtime because the API and MCP server both use it.
  "mcp>=2,<3",
  "langgraph>=0.2,<1",
  "langgraph-checkpoint-sqlite>=2,<4",
  "python-dotenv>=1,<2",
  "qdrant-client[fastembed]>=1.14,<2",
  "rank-bm25>=0.2.2,<1",
]

[project.optional-dependencies]
dev = [
  "openpyxl>=3.1,<4",
  "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"src.rules" = ["packages/*.json", "pmkisan/*.json"]
"src.ui" = ["fixtures/*.json"]
