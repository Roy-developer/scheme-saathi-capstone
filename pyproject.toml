[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "scheme-saathi-capstone"
version = "0.1.0"
description = "Scheme Saathi capstone application"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.40,<2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
